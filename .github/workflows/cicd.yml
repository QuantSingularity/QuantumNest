name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ====================================================================================
  # Job 2 -- Backend Test & Build (Pytest + import check + Docker image + smoke test)
  # ====================================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: quantumnest-backend:ci
      SECRET_KEY: ci-secret-key-min-32-characters-long-000
      API_SECRET_KEY: ci-api-secret-key-min-32-characters-00

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Compile backend sources
        working-directory: ${{ env.BACKEND_DIR }}
        run: python -m compileall -q app

      - name: Verify application imports
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: sqlite:///./ci.db
          ENVIRONMENT: development
        run: |
          set -euo pipefail
          python -c "from app.main import app; print(f'App import OK - {len(app.routes)} routes registered')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: code/backend
          file: code/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Smoke test backend container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name backend-ci -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e API_SECRET_KEY="${API_SECRET_KEY}" \
            -e DATABASE_URL="sqlite:///./quantumnest.db" \
            -e PORT=8000 \
            "${IMAGE_NAME}"

          echo "=== Waiting for /health ==="
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Backend container is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Backend container failed health check"
          docker logs backend-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs backend-ci || true

      - name: Stop backend container
        if: always()
        run: docker rm -f backend-ci || true

  # ============================================================
  # Job 3 -- Smart Contract Tests (Hardhat / Solidity)
  # ============================================================
  contract_tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BLOCKCHAIN_DIR: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.BLOCKCHAIN_DIR }}
        run: npm ci

      - name: Compile contracts
        working-directory: ${{ env.BLOCKCHAIN_DIR }}
        run: npx hardhat compile

      - name: Run contract test suite
        working-directory: ${{ env.BLOCKCHAIN_DIR }}
        run: npx hardhat test

      - name: Run coverage
        working-directory: ${{ env.BLOCKCHAIN_DIR }}
        run: npx hardhat coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage-report
          path: code/blockchain/coverage/
          retention-days: 30

  # ============================================================
  # Job 4 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 5 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: mobile-frontend/.next/
          retention-days: 7

  # ============================================================
  # Job 6 -- Docs Validation
  # ============================================================
  docs_validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Markdown (docs/ and root README)
        run: |
          set -euo pipefail
          # Line length is left to Prettier (code_quality job); inline HTML is
          # allowed for the badges/images in the README.
          cat > "$RUNNER_TEMP/markdownlint.jsonc" <<'EOF'
          {
            "config": {
              "default": true,
              "MD013": false,
              "MD033": {
                "allowed_elements": ["img", "div", "p", "br", "a", "picture", "source", "details", "summary"]
              }
            }
          }
          EOF
          npx --yes markdownlint-cli2@0.24.0 --config "$RUNNER_TEMP/markdownlint.jsonc" "docs/**/*.md" README.md

      - name: Install lychee (link checker)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 --wildcards '*/lychee'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check internal links and anchors
        run: |
          lychee --offline --no-progress --include-fragments \
            'docs/**/*.md' README.md scripts/README.md infrastructure/README.md .github/readme/README.md

      - name: Validate code samples (python, bash, json)
        run: |
          python - <<'PY'
          import ast, json, pathlib, re, subprocess, sys

          FENCE = re.compile(r"^```([A-Za-z0-9_+-]*)[^\n]*\n(.*?)^```", re.S | re.M)
          failures = checked = 0
          files = sorted(pathlib.Path("docs").rglob("*.md")) + [pathlib.Path("README.md")]
          for path in files:
              text = path.read_text(encoding="utf-8")
              for m in FENCE.finditer(text):
                  lang, body = m.group(1).lower(), m.group(2)
                  line = text.count("\n", 0, m.start()) + 1
                  err = None
                  if lang in ("python", "py"):
                      try:
                          ast.parse(body)
                      except SyntaxError as e:
                          err = f"python: {e.msg} (block line {e.lineno})"
                  elif lang in ("bash", "sh", "shell"):
                      r = subprocess.run(["bash", "-n"], input=body, text=True, capture_output=True)
                      if r.returncode:
                          err = "bash: " + r.stderr.strip().splitlines()[-1]
                  elif lang == "json":
                      try:
                          json.loads(body)
                      except ValueError as e:
                          err = f"json: {e}"
                  else:
                      continue
                  checked += 1
                  if err:
                      failures += 1
                      print(f"::error file={path},line={line}::{err}")
          print(f"Checked {checked} code blocks, {failures} invalid")
          sys.exit(1 if failures else 0)
          PY

      - name: Check docs are consistent with the repository
        run: |
          set -euo pipefail
          status=0

          # Every script in scripts/ must be documented in docs/CLI.md, and vice versa.
          scripts=$(for f in scripts/*.sh; do basename "$f"; done | sort)
          # shellcheck disable=SC2016  # the backticks are literal Markdown code spans
          documented=$(grep -oE '`[A-Za-z0-9_-]+\.sh`' docs/CLI.md | tr -d '`' | sort -u)
          for s in $(comm -23 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::scripts/$s exists but is not documented in docs/CLI.md"; status=1
          done
          for s in $(comm -13 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::docs/CLI.md documents $s but scripts/$s does not exist"; status=1
          done

          # Every page in docs/ must be reachable from the docs index.
          for f in docs/*.md docs/examples/*.md; do
            name=${f#docs/}
            [ "$name" = "README.md" ] && continue
            grep -q "($name)" docs/README.md || { echo "::error file=$f::not linked from docs/README.md"; status=1; }
          done

          # Large binaries bloat clones; warn only.
          while IFS= read -r big; do
            echo "::warning file=$big::file is larger than 5 MB; consider compressing it (e.g. PNG/WebP instead of BMP)"
          done < <(find docs -type f -size +5M)

          exit "$status"

      - name: Check external links (advisory)
        continue-on-error: true
        run: |
          lychee --no-progress --max-retries 2 --timeout 20 --accept '200..=299,429' \
            'docs/**/*.md' README.md

  # ============================================================
  # Job 7 -- Infrastructure Validation
  # (Terraform, Kubernetes, Ansible, Docker)
  # ============================================================
  infrastructure_validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 30

    env:
      KUBERNETES_VERSION: "1.28.0"
      KUBECONFORM_VERSION: "0.8.0"
      KUSTOMIZE_VERSION: "5.4.3"
      HADOLINT_VERSION: "2.15.1"
      ANSIBLE_CONFIG: ${{ github.workspace }}/infrastructure/ansible/ansible.cfg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-ci.txt

      - name: Install CI tooling (pinned in infrastructure/requirements-ci.txt)
        run: python -m pip install -r infrastructure/requirements-ci.txt

      # ---- Terraform ----------------------------------------
      # 1.9.5 matches the version baked into infrastructure/Dockerfile.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0

      - name: TFLint (fails on errors, prints warnings)
        working-directory: infrastructure/terraform
        run: tflint --recursive --minimum-failure-severity=error

      # ---- Kubernetes ---------------------------------------
      - name: Install kubeconform and kustomize
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kubeconform
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kustomize
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Rendered offline, so no cluster is needed (kubectl --dry-run needs an API server).
      # Secrets are managed outside kustomize (see base/kustomization.yaml), so the
      # example Secret manifest is validated on its own.
      - name: Validate Kubernetes base manifests
        working-directory: infrastructure/kubernetes
        run: |
          set -euo pipefail
          kustomize build base > "$RUNNER_TEMP/k8s-base.yaml"
          kubeconform -kubernetes-version "$KUBERNETES_VERSION" -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/k8s-base.yaml"
          kubeconform -kubernetes-version "$KUBERNETES_VERSION" -strict -summary -ignore-missing-schemas \
            -schema-location default base/namespace.yaml base/app-secrets.example.yaml

      - name: Validate Kubernetes environment overlays
        working-directory: infrastructure/kubernetes
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            kustomize build "environments/$env" > "$RUNNER_TEMP/k8s-$env.yaml"
            kubeconform -kubernetes-version "$KUBERNETES_VERSION" -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$RUNNER_TEMP/k8s-$env.yaml"
          done
          python - <<'PY'
          import os, sys, yaml
          from urllib.parse import urlparse

          expected = {"dev": "quantumnest-dev", "staging": "quantumnest-staging", "prod": "quantumnest-prod"}
          problems = []

          # Namespaces are bootstrapped from base/namespace.yaml (see DEPLOY.md), so it
          # must define exactly the three environment namespaces.
          with open("base/namespace.yaml") as f:
              defined = sorted(d["metadata"]["name"] for d in yaml.safe_load_all(f) if d)
          if defined != sorted(expected.values()):
              problems.append(f"base/namespace.yaml defines {defined}, expected {sorted(expected.values())}")

          for env, ns in expected.items():
              with open(os.path.join(os.environ["RUNNER_TEMP"], f"k8s-{env}.yaml")) as f:
                  docs = [d for d in yaml.safe_load_all(f) if d]

              for d in docs:
                  kind, name = d["kind"], d["metadata"]["name"]
                  if kind == "Namespace":
                      problems.append(f"{env}: overlay renders Namespace/{name}; namespaces come from base/namespace.yaml")
                  elif d["metadata"].get("namespace") != ns:
                      problems.append(f"{env}: {kind}/{name} is not in namespace {ns}")
                  # Secrets are managed outside kustomize and must never be rendered here.
                  if kind == "Secret":
                      problems.append(f"{env}: Secret/{name} must not be part of the rendered overlay")
                  # RoleBinding subjects must follow the environment's namespace.
                  if kind == "RoleBinding":
                      for subject in d.get("subjects", []):
                          if subject.get("namespace") not in (None, ns):
                              problems.append(f"{env}: RoleBinding/{name} subject {subject['name']} is in {subject['namespace']}, expected {ns}")

              # Ingress backends must point at Services that exist, and TLS hosts at routed hosts.
              services = {d["metadata"]["name"] for d in docs if d["kind"] == "Service"}
              hosts = set()
              for d in docs:
                  if d["kind"] != "Ingress":
                      continue
                  for rule in d["spec"]["rules"]:
                      hosts.add(rule["host"])
                      for path in rule["http"]["paths"]:
                          svc = path["backend"]["service"]["name"]
                          if svc not in services:
                              problems.append(f"{env}: Ingress/{d['metadata']['name']} routes {rule['host']}{path['path']} to unknown Service {svc}")
                  for tls in d["spec"].get("tls", []):
                      for host in tls.get("hosts", []):
                          if host not in hosts:
                              problems.append(f"{env}: Ingress/{d['metadata']['name']} has a TLS host {host} that no rule routes")

              # The backend ConfigMap must point at this environment's own hosts.
              config = next(d for d in docs if d["kind"] == "ConfigMap" and d["metadata"]["name"].endswith("backend-config"))["data"]
              urls = [config["API_URL"]] + [o.strip() for o in config["ALLOWED_ORIGINS"].split(",") if o.strip()]
              for url in urls:
                  host = urlparse(url).hostname
                  if host not in hosts:
                      problems.append(f"{env}: ConfigMap URL {url} does not match any Ingress host {sorted(hosts)}")

              # Production must run pinned application images.
              if env == "prod":
                  for d in docs:
                      if d["kind"] not in ("Deployment", "StatefulSet"):
                          continue
                      spec = d["spec"]["template"]["spec"]
                      for c in spec.get("initContainers", []) + spec["containers"]:
                          image = c["image"]
                          if not image.startswith("quantumnest/"):
                              continue
                          tag = image.rsplit(":", 1)[1] if ":" in image else ""
                          if tag in ("", "latest", "dev", "staging"):
                              problems.append(f"prod: {d['metadata']['name']} uses unpinned image {image}")

          for p in problems:
              print(f"::error::{p}")
          print("Overlays OK" if not problems else f"{len(problems)} problem(s)")
          sys.exit(1 if problems else 0)
          PY

      # ---- Ansible ------------------------------------------
      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          if [ ! -f inventory/hosts.yml ]; then
            echo "::notice::inventory/hosts.yml is not tracked; validating with the example inventory"
            cp inventory/hosts.example.yml inventory/hosts.yml
          fi
          ansible-playbook --syntax-check playbooks/main.yml

      # The tracked hosts.yml has empty groups (real hosts are added per deployment),
      # so host matching is checked against the example inventory.
      - name: Check every play matches at least one host
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          empty=$(ansible-playbook -i inventory/hosts.example.yml --list-hosts playbooks/main.yml | awk '/^ *play #/{play=$0} /hosts \(0\)/{print play}')
          if [ -n "$empty" ]; then
            while IFS= read -r line; do
              echo "::error::play matches no hosts: $line"
            done <<< "$empty"
            exit 1
          fi

      - name: ansible-lint (content must load; full style rules are not enforced)
        working-directory: infrastructure/ansible
        run: ansible-lint --offline --profile min .

      - name: Check role template and include references resolve
        working-directory: infrastructure/ansible
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          def walk(tasks):
              for task in tasks or []:
                  yield task
                  for key in ("block", "rescue", "always"):
                      yield from walk(task.get(key))

          bad = 0
          for tasks_file in sorted(pathlib.Path("roles").glob("*/tasks/*.yml")):
              role = tasks_file.parents[1]
              for task in walk(yaml.safe_load(tasks_file.read_text())):
                  for mod in ("template", "ansible.builtin.template"):
                      if mod in task:
                          src = task[mod]["src"]
                          if "{{" not in src and not (role / "templates" / src).exists():
                              print(f"::error file=infrastructure/ansible/{tasks_file}::template {src} does not exist in {role}/templates")
                              bad += 1
                  for mod in ("include_tasks", "import_tasks", "ansible.builtin.include_tasks", "ansible.builtin.import_tasks"):
                      if mod in task:
                          ref = task[mod] if isinstance(task[mod], str) else task[mod].get("file")
                          if ref and "{{" not in ref and not (tasks_file.parent / ref).exists():
                              print(f"::error file=infrastructure/ansible/{tasks_file}::{mod} {ref} does not exist")
                              bad += 1
          print("All references resolve" if not bad else f"{bad} unresolved reference(s)")
          sys.exit(1 if bad else 0)
          PY

      # Rendering with Ansible's own engine catches undefined variables and template
      # syntax errors that a syntax check cannot.
      - name: Render role templates
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render.yml" <<'EOF'
          - hosts: localhost
            connection: local
            gather_facts: true
            tasks:
              - ansible.builtin.template:
                  src: "{{ item }}"
                  dest: "{{ out_dir }}/{{ item | basename | regex_replace('[.]j2$', '') }}"
                  mode: "0644"
                with_fileglob: "{{ role_dir }}/templates/*.j2"
          EOF
          for templates in roles/*/templates; do
            role=$(basename "$(dirname "$templates")")
            out="$RUNNER_TEMP/rendered/$role"
            mkdir -p "$out"
            extra=(-e "@group_vars/all/vault.example.yml")
            for vars in "roles/$role/defaults/main.yml" "roles/$role/vars/main.yml"; do
              [ -f "$vars" ] && extra+=(-e "@$vars")
            done
            ansible-playbook -i localhost, "$RUNNER_TEMP/render.yml" \
              -e "role_dir=$PWD/roles/$role" -e "out_dir=$out" "${extra[@]}"
          done
          # Every template must produce a non-empty file with no unrendered Jinja left in it.
          if [ -z "$(find "$RUNNER_TEMP/rendered" -type f)" ]; then
            echo "::error::no templates were rendered"; exit 1
          fi
          find "$RUNNER_TEMP/rendered" -type f -empty -print | while read -r f; do
            echo "::error::rendered template is empty: $f"; exit 1
          done
          if grep -rnE '\{\{|\{%' "$RUNNER_TEMP/rendered"; then
            echo "::error::unrendered Jinja markers in rendered output"; exit 1
          fi

      - name: yamllint (Kubernetes, Ansible, Compose)
        working-directory: infrastructure
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" \
            kubernetes/base kubernetes/environments ansible docker-compose.yml

      # ---- Docker -------------------------------------------
      - name: Validate Docker Compose file
        working-directory: infrastructure
        run: |
          set -euo pipefail
          # The compose file requires secrets via ${VAR:?}; use the example values.
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile tools config --quiet

      - name: Lint Dockerfile (fails on errors, prints warnings)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x "$HOME/.local/bin/hadolint"
          "$HOME/.local/bin/hadolint" --failure-threshold error infrastructure/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The backend image is built in the Backend job; build the infra tooling one here.
      - name: Build infra-tools Docker image
        uses: docker/build-push-action@v6
        with:
          context: infrastructure
          file: infrastructure/Dockerfile
          target: final
          push: false
          tags: quantumnest/infra-tools:ci-${{ github.sha }}
          cache-from: type=gha,scope=infra-tools-image
          cache-to: type=gha,mode=max,scope=infra-tools-image

      # ---- Secrets ------------------------------------------
      # Markdown is excluded: the deployment guide contains placeholder values.
      - name: Scan infrastructure for hard-coded secrets
        working-directory: infrastructure
        run: |
          set -uo pipefail
          found=0
          for pattern in 'password\s*=\s*"[^"]{8,}"' 'secret\s*=\s*"[^"]{8,}"' 'api[_-]key\s*=\s*"[^"]{8,}"' 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY'; do
            hits=$(grep -rEIin --exclude='*.md' "$pattern" terraform kubernetes ansible \
              | grep -v '\.example' \
              | grep -viE 'placeholder|change_?me|:[0-9]+:\s*#' || true)
            if [ -n "$hits" ]; then
              echo "::error::possible hard-coded secret matching /$pattern/"
              echo "$hits"
              found=1
            fi
          done
          exit "$found"

  # ============================================================
  # Job 8 -- Scripts Validation
  # ============================================================
  scripts_validation:
    name: Scripts Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ShellCheck
        run: python -m pip install shellcheck-py==0.11.0.1

      - name: ShellCheck all tracked shell scripts (fails on warnings and errors)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

      - name: ShellCheck stricter style findings (advisory)
        continue-on-error: true
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=info

      - name: Check syntax and shebang of all tracked shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
            head -n 1 "$f" | grep -qE '^#!.*(bash|sh)' || { echo "::error file=$f::missing shebang"; exit 1; }
          done < <(git ls-files -z '*.sh')

      - name: Check shell scripts are executable in git
        run: |
          missing=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$missing" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::not executable in git. Fix: git update-index --chmod=+x $f"
            done <<< "$missing"
            exit 1
          fi

      # Only scripts with a real --help handler are listed: the others
      # (run_quantumnest.sh, build.sh, run_all_tests.sh, ...) would start services
      # or run builds and test suites instead of printing usage.
      - name: Smoke test --help on CLI scripts
        run: |
          set -uo pipefail
          status=0
          before=$(git status --porcelain)
          for s in scripts/dependency_checker.sh scripts/env_manager.sh scripts/log_aggregator.sh infrastructure/deploy.sh; do
            if out=$(timeout 30 bash "$s" --help </dev/null 2>&1) && grep -qi 'usage' <<< "$out"; then
              echo "OK   $s --help"
            else
              echo "::error file=$s::--help did not exit 0 with a usage message"
              status=1
            fi
          done
          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "::error::--help modified the working tree:"; git status --porcelain; status=1
          fi
          exit "$status"
